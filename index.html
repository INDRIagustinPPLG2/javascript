<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let angka1=prompt("masukan angka");
        let angka2=prompt("masukan pangkat");
        function hitung(){
            return angka1 ** angka2
        }
        let hasil=hitung(angka1,angka2);
        alert(hitung(hasil));

        let angka=prompt("masukan angka: ");
        if (angka % 2 === 0){
            document.write(angka + " adalah bilangan genap");
        }else {
            document.write(angka + " adalah bilanga ganjil");
        }

                   
    </script>
</body>
</html>
